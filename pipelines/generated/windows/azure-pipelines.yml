# ==============================================================================
# Azure DevOps Pipeline: examples/windows/job.yaml (y2p)
# Prechecks:
#   - check-if-subscription-in-tenant (invoke): continue, end_check
#   - check-if-vm-is-running (invoke, collect): start-stop, stop
# Steps:
#   - check-defender
#   - check-hotfix
#   - check-os-build
#   - tls-settings
# Columns:
#   - vm_name
#   - resource_group
#   - subscription
#   - os_target
#   - os_name
#   - os_build
#   - kernel_version
#   - defender_enabled
#   - realtime_enabled
#   - signature_age
#   - last_hotfix
#   - hotfix_count
#   - tls12_enabled
#   - verdict
# Post hooks:
#   - log-audit-summary
# Reachable Azure mutations: runCommand POST, vm start, deallocate, powerOff
#
# Generated by `y2p export-ado` — do not edit, regenerate.
# Known ADO limitation: re-running only a failed Invoke job re-publishes the fixed artifact name
# 'y2-state-invoke'; to re-run after a failure, re-run the whole pipeline.
# ==============================================================================
trigger: none

parameters:
  - name: vmFilter
    displayName: Optional VM Filter (empty = all in CSV)
    type: object
    default: []
  - name: parallel
    displayName: Concurrency Budget (0 = use job.yaml)
    type: number
    default: 0

stages:
  - template: templates/y2-fleet-run.yml
    parameters:
      vmFilter: ${{ parameters.vmFilter }}
      parallel: ${{ parameters.parallel }}
