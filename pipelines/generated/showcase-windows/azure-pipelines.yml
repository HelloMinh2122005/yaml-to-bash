# ==============================================================================
# Azure DevOps Pipeline: examples/showcase/windows/job.yaml (y2p)
# Prechecks:
#   - check-if-subscription-in-tenant (invoke): continue, end_check
#   - check-if-vm-is-running (invoke, collect): start-stop, stop
# Steps:
#   - say-hello
#   - do-math
#   - get-system-info
#   - get-updates
#   - download-package
#   - dedupe-packages
#   - cleanup
# Columns:
