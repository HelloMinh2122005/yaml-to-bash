#   - mem_mb
#   - uptime_secs
#   - vm_size
#   - location
#   - upd_count
#   - upd_latest
#   - upd_latest_date
#   - kernel_count
#   - dl_status
#   - dl_bytes
#   - dl_sha256_12
#   - dup_found
#   - dup_deleted
