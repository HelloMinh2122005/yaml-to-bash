# ==============================================================================
# Azure DevOps Pipeline: examples/showcase/linux/job.yaml (y2b)
# Prechecks:
#   - check-if-subscription-in-tenant (invoke): continue, end_check
#   - check-if-vm-is-running (invoke, collect): start-stop, stop
# Steps:
#   - say-hello
#   - do-math
#   - get-system-info
#   - get-updates
#   - download-package
#   - dedupe-packages
#   - cleanup
# Columns:
#   - vm_name
#   - os_target
#   - hello
#   - shell_version
#   - math_sum
#   - math_fact10
#   - math_cpu_x1024
#   - os_name
#   - os_version
#   - kernel
#   - cpu_count
#   - mem_mb
#   - uptime_secs
#   - vm_size
#   - location
#   - upd_count
#   - upd_latest
#   - upd_latest_date
#   - kernel_count
#   - dl_status
#   - dl_bytes
#   - dl_sha256_12
#   - dup_found
#   - dup_deleted
#   - files_left
#   - dedup_source
#   - cleanup
#   - math_check
#   - verdict
# Post hooks:
#   - log-audit-summary
# Reachable Azure mutations: runCommand POST, vm start, deallocate, powerOff
#
# Generated by `y2b export-ado` — do not edit, regenerate.
# Known ADO limitation: re-running only a failed Invoke job re-publishes the fixed artifact name
# 'y2-state-invoke'; to re-run after a failure, re-run the whole pipeline.
# ==============================================================================
parameters:
  - name: vmFilter
    type: object
    default: []
  - name: parallel
    type: number
    default: 0

stages:
  # ------------------------------------------------------------------ Validate
  - stage: Validate
    jobs:
      - job: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - template: y2-setup.yml
          - bash: |
              set -euo pipefail
              y2b validate "examples/showcase/linux/job.yaml"
              y2b compile "examples/showcase/linux/job.yaml" -o "$(Agent.TempDirectory)/payload_check"
              if ! diff -u "pipelines/generated/showcase-linux/payload/remote.sh" "$(Agent.TempDirectory)/payload_check"; then
                echo "##vso[task.logissue type=error]Compiled payload differs from committed pipelines/generated/showcase-linux/payload/remote.sh. Run: y2b export-ado ..."
                exit 1
              fi
              y2b explain "examples/showcase/linux/job.yaml" --format text -o "$(Agent.TempDirectory)/explain_check.txt"
              if ! diff -u "pipelines/generated/showcase-linux/plan/explain.txt" "$(Agent.TempDirectory)/explain_check.txt"; then
                echo "##vso[task.logissue type=error]Explain text output differs from committed pipelines/generated/showcase-linux/plan/explain.txt. Run: y2b export-ado ..."
                exit 1
              fi
              y2b explain "examples/showcase/linux/job.yaml" --format md -o "$(Agent.TempDirectory)/explain_check.md"
              if ! diff -u "pipelines/generated/showcase-linux/plan/explain.md" "$(Agent.TempDirectory)/explain_check.md"; then
                echo "##vso[task.logissue type=error]Explain markdown output differs from committed pipelines/generated/showcase-linux/plan/explain.md. Run: y2b export-ado ..."
                exit 1
              fi
              echo "##vso[task.uploadsummary]$(Agent.TempDirectory)/explain_check.md"
              mkdir -p "$(Build.ArtifactStagingDirectory)/y2-plan/payload"
              mkdir -p "$(Build.ArtifactStagingDirectory)/y2-plan/plan"
              cp "pipelines/generated/showcase-linux/payload/remote.sh" "$(Build.ArtifactStagingDirectory)/y2-plan/payload/"
              cp "pipelines/generated/showcase-linux/plan/explain.txt" "pipelines/generated/showcase-linux/plan/explain.md" "$(Build.ArtifactStagingDirectory)/y2-plan/plan/"
            displayName: Validate job, payload and plan
          - publish: $(Build.ArtifactStagingDirectory)/y2-plan
            artifact: y2-plan

  # ------------------------------------------------------------------ Fleet
  - stage: Fleet
    dependsOn: Validate
    jobs:
      # ---------- Phase 1: run-command #1 (runCommand POST, no wait) ----------
      - deployment: Invoke
        environment: y2-lab
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 120
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - checkout: self
                - template: y2-setup.yml
                - task: AzureCLI@2
                  name: fire
                  displayName: "Phase 1 · invoke (run-command 1 of 2)"
                  inputs:
                    azureSubscription: sc-azure-lab
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -uo pipefail
                      set -f
                      args=()
                      for v in ${{ join(' ', parameters.vmFilter) }}; do
                        args+=(--vm "$v")
                      done
                      if [ "${{ parameters.parallel }}" -gt 0 ]; then
                        args+=(--parallel "${{ parameters.parallel }}")
                      fi
                      out="$(Agent.TempDirectory)/invoke.out"
                      y2b run "examples/showcase/linux/job.yaml" --phase invoke -y "${args[@]}" | tee "$out"
                      rc=${PIPESTATUS[0]}
                      fired=0
                      while IFS= read -r line; do
                        case "$line" in
                          fired=*) fired="${line#fired=}" ;;
                        esac
                      done < "$out"
                      echo "##vso[task.setvariable variable=fired;isOutput=true]$fired"
                      exit "$rc"
                - bash: |
                    set -euo pipefail
                    if [ -d "examples/showcase/linux/.result.parts" ]; then
                      tar -czf "$(Build.ArtifactStagingDirectory)/y2-state.tgz" -C "$(Build.SourcesDirectory)" "examples/showcase/linux/.result.parts"
                      echo "##vso[task.setvariable variable=hasState;isOutput=true]true"
                    else
                      echo "##vso[task.setvariable variable=hasState;isOutput=true]false"
                    fi
                  name: pack
                  displayName: Pack run state
                  condition: always()
                - publish: $(Build.ArtifactStagingDirectory)/y2-state.tgz
                  artifact: y2-state-invoke
                  displayName: Publish run state (for Collect)
                  condition: and(always(), eq(variables['pack.hasState'], 'true'))

      # ---------- Wait: agentless, holds no agent ----------
      - job: Wait
        dependsOn: Invoke
        condition: and(succeeded(), ne(dependencies.Invoke.outputs['Invoke.fire.fired'], '0'))
        pool: server
        timeoutInMinutes: 16
        steps:
          - task: Delay@1
            displayName: "Wait ≥ sleep_before_collect"
            inputs:
              delayForMinutes: '1'

      # ---------- Phase 2: run-command #2 (reader) + merge ----------
      - job: Collect
        dependsOn: [Invoke, Wait]
        condition: and(in(dependencies.Wait.result, 'Succeeded', 'Skipped'), or(eq(dependencies.Invoke.result, 'Succeeded'), and(eq(dependencies.Invoke.result, 'Failed'), eq(dependencies.Invoke.outputs['Invoke.pack.hasState'], 'true'))))
        pool:
          vmImage: ubuntu-latest
        timeoutInMinutes: 122
        steps:
          - checkout: self
          - template: y2-setup.yml
          - download: current
            artifact: y2-state-invoke
            condition: eq(dependencies.Invoke.outputs['Invoke.pack.hasState'], 'true')
          - bash: |
              set -euo pipefail
              if [ -f "$(Pipeline.Workspace)/y2-state-invoke/y2-state.tgz" ]; then
                tar -xzf "$(Pipeline.Workspace)/y2-state-invoke/y2-state.tgz" -C "$(Build.SourcesDirectory)"
              fi
            displayName: Restore run state
          - task: AzureCLI@2
            name: collect
            displayName: "Phase 2 · collect (run-command 2 of 2) + Phase 3 post + merge"
            inputs:
              azureSubscription: sc-azure-lab
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -uo pipefail
                set -f
                args=()
                for v in ${{ join(' ', parameters.vmFilter) }}; do
                  args+=(--vm "$v")
                done
                if [ "${{ parameters.parallel }}" -gt 0 ]; then
                  args+=(--parallel "${{ parameters.parallel }}")
                fi
                y2b run "examples/showcase/linux/job.yaml" --phase collect -y "${args[@]}"
                rc=$?
                if [ -d "examples/showcase/linux/.result.parts" ]; then
                  still=true
                else
                  still=false
                fi
                echo "##vso[task.setvariable variable=stillRunning;isOutput=true]$still"
                if [ "$rc" -eq 2 ]; then
                  echo "##vso[task.logissue type=warning]Some VMs are not OK (SKIPPED/ENDED/ERROR). See result.csv."
                  echo "##vso[task.complete result=SucceededWithIssues;]"
                  rc=0
                fi
                exit "$rc"
          - bash: |
              set -euo pipefail
              OUT="$(Build.ArtifactStagingDirectory)/results"
              mkdir -p "$OUT"
              if [ -f "examples/showcase/linux/result.csv" ]; then
                cp "examples/showcase/linux/result.csv" "$OUT/"
              fi
              if [ -f "examples/showcase/linux/result.log" ]; then
                cp "examples/showcase/linux/result.log" "$OUT/"
              fi
              if [ -d "examples/showcase/linux/.result.parts" ]; then
                tar -czf "$(Build.ArtifactStagingDirectory)/y2-state-collect.tgz" -C "$(Build.SourcesDirectory)" "examples/showcase/linux/.result.parts"
              fi
            displayName: Stage results
            condition: always()
          - publish: $(Build.ArtifactStagingDirectory)/results
            artifact: y2-results
            displayName: Publish results (csv and log)
            condition: always()
          - publish: $(Build.ArtifactStagingDirectory)/y2-state-collect.tgz
            artifact: y2-state-collect
            displayName: Publish remaining run state
            condition: and(always(), eq(variables['collect.stillRunning'], 'true'))
