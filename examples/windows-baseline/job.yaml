# ==============================================================================
# Windows Baseline Job Configuration (y2p)
# ==============================================================================
input: "./list_vm.csv"
output_log: "./result.log"
output_csv: "./result.csv"
actions: "skip"
parallel: 10

sleep_before_collect: "3m"
collect_retry_interval: "30s"
collect_retries: 3

invoke:
  # Host-side bash prechecks executed on the macOS host
  precheck:
    - name: "check-if-subscription-in-tenant"
      script: |
        az account show --subscription "$SUBSCRIPTION" > /dev/null 2>&1
        if [ $? -eq 0 ]; then
          echo 0
        else
          echo 1
        fi
      result:
        0:
          log: "Subscription verified in tenant"
          action: "continue"
        1:
          log: "Subscription not found in tenant - skipping VM"
          action: "end_check"

    - name: "check-if-vm-is-running"
      script: |
        az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" \
          --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code" -o tsv
      result:
        "PowerState/running":
          log: "VM is running"
          action: "continue"
        "PowerState/deallocated":
          log: "VM is deallocated"
          action: "skip"

  # Remote Windows PowerShell runcommand
  runcommand:
    res_file: 'C:\ProgramData\y2p\result.res'
    log_file: 'C:\ProgramData\y2p\result.log'
    steps:
      - name: "check-defender"
        timeout: 60
        script: |
          $s = Get-MpComputerStatus
          write_result DEFENDER_ENABLED "$($s.AntivirusEnabled)"
          write_result SIGNATURE_AGE_DAYS "$($s.AntivirusSignatureAge)"

      - name: "check-hotfix"
        timeout: 60
        script: |
          $hf = Get-HotFix | Sort-Object InstalledOn | Select-Object -Last 1
          write_result LAST_HOTFIX "$($hf.HotFixID)"

      - name: "check-os-build"
        timeout: 60
        script: |
          $b = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild
          write_result OS_BUILD "$b"

      - name: "tls-settings"
        timeout: 60
        script_path: "./scripts/check_tls.ps1"

collect:
  - column: "vm_name"
    source: "input.vm_name"

  - column: "resource_group"
    source: "input.resource_group"

  - column: "subscription"
    source: "input.subscription"

  - column: "os"
    source: "input.os"

  - column: "defender_enabled"
    var: "DEFENDER_ENABLED"

  - column: "signature_age"
    var: "SIGNATURE_AGE_DAYS"

  - column: "last_hotfix"
    var: "LAST_HOTFIX"

  - column: "os_build"
    var: "OS_BUILD"

  - column: "tls12_enabled"
    var: "TLS12_ENABLED"

  # Computed column: evaluated with bash on the host
  - column: "verdict"
    script: |
      if [ "$DEFENDER_ENABLED" = "True" ]; then
        echo "OK"
      else
        echo "FIX"
      fi

