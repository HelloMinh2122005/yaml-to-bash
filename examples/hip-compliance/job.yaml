# ==============================================================================
# Job Configuration
# ==============================================================================
input: "./list_vm.csv"             # Path to input CSV listing target VMs
output_log: "./result.log"         # Unified framework log on the host
output_csv: "./result.csv"         # Path to the final aggregated CSV report
actions: "skip"                    # Power state policy: "skip" | "start" (if VM stopped)
parallel: 10                       # Number of concurrent VM jobs running at once

# ==============================================================================
# Pipeline 1: Invoke (Host Precheck + Remote Run Command)
# ==============================================================================
invoke:
  # Host-side pre-flight checks executed prior to VM invocation.
  precheck:
    - name: "check-if-subscription-in-tenant"
      script: |
        # Return 0 if subscription is valid, 1 if not
        az account show --subscription "$SUBSCRIPTION" > /dev/null 2>&1
        if [ $? -eq 0 ]; then
          echo 0
        else
          echo 1
        fi
      result:
        0:
          log: "Subscription verified in tenant"
          action: "continue"
        1:
          log: "Subscription not found in tenant - skipping VM"
          action: "end_check"

    - name: "check-if-vm-is-running"
      script: |
        az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" \
          --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code" -o tsv
      result:
        "PowerState/running":
          log: "VM is running"
          action: "continue"
        "PowerState/deallocated":
          log: "VM is deallocated"
          action: "skip"            # Handled according to root 'actions' policy

  # Remote VM execution payload via Azure Run-Command.
  runcommand:
    res_file: "/var/tmp/runcommand/result.res"
    log_file: "/var/tmp/runcommand/result.log"
    steps:
      - name: "check-hip-version"
        var: "HIP_VERSION"
        script: |
          # Query package or version
          VERSION=$(rpm -q --queryformat '%{VERSION}' hip 2>/dev/null || echo "NOT_INSTALLED")
          write_result "$VERSION"

      - name: "check-kernel-count"
        var: "KERNEL_COUNT"
        script: |
          COUNT=$(dnf repoquery --installed kernel 2>/dev/null | wc -l)
          write_result "$COUNT"

      - name: "complex-hardware-audit"
        var: "HW_AUDIT_STATUS"
        script_path: "./scripts/audit_hardware.sh"   # Path to external bash script

# ==============================================================================
# Pipeline 2: Collect & Transform (CSV Column Mapping)
# ==============================================================================
collect:
  # 1. Direct Passthrough Columns (from input CSV)
  - column: "vm_name"
    source: "input.vm_name"

  - column: "resource_group"
    source: "input.resource_group"

  - column: "subscription"
    source: "input.subscription"

  - column: "os"
    source: "input.os"

  # 2. Remote Variable Columns (from res_file on VM)
  - column: "hip_version"
    var: "HIP_VERSION"

  - column: "kernel_count"
    var: "KERNEL_COUNT"

  # 3. Computed Columns (Host-evaluated logic based on gathered variables)
  - column: "recommendation"
    script: |
      EXPECTED="22102026"
      if [ "$HIP_VERSION" = "NOT_INSTALLED" ]; then
        echo "Install HIP"
      elif [ "$HIP_VERSION" != "$EXPECTED" ]; then
        echo "Update to $EXPECTED"
      else
        echo "Compliant"
      fi

  - column: "extended_compliance"
    script_path: "./scripts/calc_compliance.sh"

