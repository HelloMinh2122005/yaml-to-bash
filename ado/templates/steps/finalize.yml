# finalize.yml - Finalize patch run, aggregate status.csv, and report ADO job result
# Part of ADO-native patch template package (R1).
# Pure ASCII, LF line endings, BOM-less UTF-8.

parameters:
  - name: serviceConnection
    type: string

steps:
  - task: AzurePowerShell@5
    displayName: 'Finalize patch run and write status'
    condition: always()
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      ScriptType: 'FilePath'
      ScriptPath: '$(Y2_SCRIPTS_DIR)/finalize.ps1'
      ScriptArguments: -WorkDir '$(Y2_WORK_DIR)' -ReportDir '$(Y2_REPORT_DIR)'
      azurePowerShellVersion: 'LatestVersion'
      pwsh: false
      errorActionPreference: 'stop'
      FailOnStandardError: false
